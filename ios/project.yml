# XcodeGen spec for the iOS wrapper apps: one target (and scheme) per game,
# GeneralsXZH (Zero Hour) and GeneralsX (Generals), built from one template.
#
# Each target exists to (a) obtain a provisioning profile + signed bundle via
# normal Xcode automatic signing, and (b) define the Info.plist the game needs
# (file sharing for assets, landscape-only, fullscreen). The packaging script
# (package-ios-zh.sh --scheme <target>) then replaces the stub executable with
# the real engine binary (z_generals or g_generals), embeds the runtime
# dylibs, and re-signs everything.
# NOTE: the bundle id and development team below are defaults; the packaging
# script overrides them at build time via GX_BUNDLE_ID / GX_TEAM_ID, so point
# those at your own Apple Developer account rather than editing this file.
name: GeneralsX-iOS
options:
  bundleIdPrefix: me.ammaar
  deploymentTarget:
    iOS: "16.0"
targetTemplates:
  GameShell:
    type: application
    platform: iOS
    sources:
      - path: Stub
        excludes:
          - "*.plist"
    settings:
      base:
        DEVELOPMENT_TEAM: 7S264298H8
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      properties:
        CFBundleShortVersionString: "1.04"
        CFBundleVersion: "10"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchStoryboardName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: "Used for LAN multiplayer game discovery."
targets:
  GeneralsXZH:
    templates: [GameShell]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ammaar.generalszh
    info:
      path: Stub/Info.plist
      properties:
        CFBundleDisplayName: Generals ZH
  GeneralsX:
    templates: [GameShell]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.ammaar.generals
    info:
      path: Stub/Info-Generals.plist
      properties:
        CFBundleDisplayName: Generals
