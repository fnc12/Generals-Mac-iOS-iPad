; HelloMod: the smallest possible data mod.
; It contains no game assets: it re-opens objects the game already defines
; and changes a few fields. Everything else about the units stays as it is.
; Files in a directory load in sorted order, so "zz_" makes this one load last.

; China dozer: cheap and fast, so the change is visible on the first screen.
Object ChinaVehicleDozer
  BuildCost = 123
  BuildTime = 1.0
End

; China Battlemaster tank: cheap and fast.
Object ChinaTankBattleMaster
  BuildCost = 100
  BuildTime = 1.0
End
